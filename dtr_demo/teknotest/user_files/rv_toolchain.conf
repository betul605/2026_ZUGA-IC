# RISC-V toolchain prefix (build.py bu dosyayi okur).
# Bu dosya hakem degerlendirmesinde KENDI ortamlarina gore guncellenecektir;
# burada sadece SIZIN sisteminizde calismasi yeterlidir.
#
# Asagidakini kendi toolchain yolunuza gore duzenleyin (ornekler):
# RISCV_GCC_PREFIX = "/opt/riscv/bin/riscv32-unknown-elf"
# RISCV_GCC_PREFIX = "/usr/bin/riscv64-unknown-elf"          # Ubuntu paketi (rv32imc destekler)
#
# Windows ornegi (.exe ekini script otomatik ekler):
# RISCV_GCC_PREFIX = r"C:\RISC-V\bin\riscv32-unknown-elf"

RISCV_GCC_PREFIX = "/usr/bin/riscv64-unknown-elf"
